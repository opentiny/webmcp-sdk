# PR 测试门禁：单元测试 + 浏览器 E2E 全部通过后才允许合入
name: CI Test
run-name: CI Test--${{ github.event.pull_request.title || github.ref_name }}

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 仓库未提交 pnpm-lock.yaml，无法使用 setup-node 的 cache: pnpm
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 仓库未提交 lockfile，需允许解析依赖树
      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Run unit tests
        id: run-tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Upload unit test log
        if: failure() && steps.run-tests.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: test-output.log
          retention-days: 3
          overwrite: true

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Build webmcp-cli
        run: pnpm -F @opentiny/webmcp-cli build

      - name: Run browser E2E
        id: run-browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          WEBMCP_HEADLESS: '1'
          CI: 'true'
        run: |
          set -o pipefail
          pnpm test:browser 2>&1 | tee browser-test-output.log

      - name: Upload browser test log
        if: failure() && steps.run-browser.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: browser-test-output.log
          retention-days: 3
          overwrite: true

  # 聚合结果，供 PR sticky 评论使用（与 ci-test-pr-comment.yml 兼容）
  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [unit, browser]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Generate PR tip
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          UNIT="${{ needs.unit.result }}"
          BROWSER="${{ needs.browser.result }}"

          if [ "$UNIT" = "success" ] && [ "$BROWSER" = "success" ]; then
            {
              echo '**[ci-test-pass]**'
              echo
              echo 'CI 测试已通过（单元测试 + 浏览器 E2E）。'
              echo
              echo "- Workflow: [查看日志](${RUN_URL})"
              echo "- Commit: \`${SHA}\`"
              echo "- Unit: \`${UNIT}\`"
              echo "- Browser: \`${BROWSER}\`"
            } > user-tip.txt
          else
            {
              echo '**[ci-test-fail]**'
              echo
              echo 'CI 测试未通过，请修复后再合入。'
              echo
              echo "- Workflow: [查看完整日志](${RUN_URL})"
              echo "- Commit: \`${SHA}\`"
              echo "- Unit: \`${UNIT}\`"
              echo "- Browser: \`${BROWSER}\`"
              echo
              echo '失败时请下载对应 artifact（unit-test-output / browser-test-output）查看完整日志。'
            } > user-tip.txt
          fi

          echo "${{ github.event.number }}" > pr-id.txt

      - name: Upload user tip
        uses: actions/upload-artifact@v4
        with:
          name: user-tip
          path: user-tip.txt
          retention-days: 1
          overwrite: true

      - name: Upload PR number
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr-id.txt
          retention-days: 1
          overwrite: true

      - name: Fail if any test job failed
        if: needs.unit.result != 'success' || needs.browser.result != 'success'
        run: exit 1
