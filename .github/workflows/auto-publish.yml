name: Auto Publish
run-name: Auto Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: '选择需要发布的包'
        required: true
        type: choice
        options:
          - next-sdk
          - next-remoter
          - webmcp-cli
      tag:
        description: '选择 npm dist-tag'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - rc
          - latest

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build NextSDK
        if: ${{ github.event_name == 'push' || inputs.package == 'next-sdk' }}
        run: pnpm build

      - name: Build Remoter
        if: ${{ github.event_name == 'push' || inputs.package == 'next-remoter' }}
        run: pnpm build:remoter

      - name: Build WebMCP CLI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package == 'webmcp-cli' }}
        run: pnpm build:webmcp-cli

      # pnpm pack rewrites workspace: dependencies; npm publish performs the OIDC exchange.
      - name: Publish NextSDK from tag
        if: ${{ github.event_name == 'push' }}
        run: |
          tarball="$(pnpm --dir packages/next-sdk pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.filename')"
          npm publish "$tarball"

      - name: Publish Remoter from tag
        if: ${{ github.event_name == 'push' }}
        run: |
          tarball="$(pnpm --dir packages/next-remoter pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.filename')"
          npm publish "$tarball"

      - name: Publish NextSDK manually
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package == 'next-sdk' }}
        run: |
          tarball="$(pnpm --dir packages/next-sdk pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.filename')"
          npm publish "$tarball" --tag "${{ inputs.tag }}"

      - name: Publish Remoter manually
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package == 'next-remoter' }}
        run: |
          tarball="$(pnpm --dir packages/next-remoter pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.filename')"
          npm publish "$tarball" --tag "${{ inputs.tag }}"

      - name: Publish WebMCP CLI manually
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.package == 'webmcp-cli' }}
        run: |
          tarball="$(pnpm --dir packages/webmcp-cli pack --pack-destination "$RUNNER_TEMP" --json | jq -r '.filename')"
          npm publish "$tarball" --tag "${{ inputs.tag }}"

      - name: Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
