<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Extensions 配置</title>
    <style>
      body {
        font-family:
          Segoe UI,
          Roboto,
          'Helvetica Neue',
          Arial;
        padding: 20px;
        background: #f6f8fa;

        min-width: 800px;
        min-height: 500px;
      }
      .card {
        background: #fff;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 18px;
        max-width: 980px;
        margin: 0 auto;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
      }
      input[type='text'],
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #d1d5da;
        border-radius: 6px;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > * {
        flex: 1;
      }
      .domains {
        margin-top: 8px;
      }
      .domain-item {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .domain-item input {
        flex: 1;
      }
      .btn {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        background: #0366d6;
        color: #fff;
        cursor: pointer;
      }
      .btn.ghost {
        background: #fff;
        color: #0366d6;
        border: 1px solid #0366d6;
      }
      .muted {
        color: #586069;
        font-size: 13px;
      }
      .error {
        color: #c23333;
        font-size: 13px;
        margin-top: 6px;
      }
      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      dialog {
        border: none;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(3, 102, 214, 0.12);
        background: #fff;
        width: 600px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="flex-between">
        <h2>AI Extensions 提示词专家配置</h2>
        <div>
          <button id="addConfigBtn" class="btn ghost" type="button">添加配置</button>
        </div>
      </div>

      <div style="margin-top: 12px">
        <table id="configTable" style="width: 100%; border-collapse: collapse">
          <thead>
            <tr style="text-align: left; border-bottom: 1px solid #e1e4e8">
              <th style="padding: 8px">Name</th>
              <th style="padding: 8px">Label</th>
              <th style="padding: 8px">Description</th>
              <th style="padding: 8px">Domains</th>
              <th style="padding: 8px">操作</th>
            </tr>
          </thead>
          <tbody id="configTbody"></tbody>
        </table>
      </div>

      <dialog id="configDialog">
        <h3 style="margin: 0 0 12px 0">编辑配置</h3>
        <form id="configForm">
          <label for="name">专家ID</label>
          <input id="name" name="name" type="text" pattern="[A-Za-z]+" required placeholder="例如: myExtension" />

          <label for="label">专家名称</label>
          <input id="label" name="label" type="text" required placeholder="例如: 绘图专家，办公助手" />

          <label for="description">描述</label>
          <input id="description" name="description" type="text" placeholder="简短描述" />

          <label for="prompts">提示词</label>
          <textarea id="prompts" name="prompts" required rows="3" placeholder="专家提示词..."></textarea>

          <label for="domainsInput">关联域名（可选，英文逗号分隔）</label>
          <input id="domainsInput" type="text" placeholder="请输入域名 a.com, b.org" />

          <label for="toolsInput">关联工具（可选英文逗号分隔）</label>
          <input id="toolsInput" type="text" placeholder="请输入工程名称" />

          <div style="margin-top: 14px; display: flex; gap: 8px; justify-content: end">
            <button id="saveBtn" class="btn" type="submit">保存</button>
            <button id="cancelBtn" class="btn ghost" type="button">取消</button>
          </div>
        </form>
      </dialog>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
