<div class="price-protection-page">
  <div class="page-header">
    <div class="header-left">
      <h2>价保单监控</h2>
      <p class="subtitle">跟踪并审批客户提起的价保申请订单</p>
    </div>
    <div class="header-right">
      <button class="btn-add" (click)="handleManualAdd()">＋ 新增价保申请</button>
    </div>
  </div>
  <div class="page-content">
    <table class="data-table">
      <thead>
        <tr>
          <th style="width: 50px">#</th>
          <th style="width: 180px">订单号</th>
          <th>商品名称</th>
          <th>购买价格</th>
          <th>当前价格</th>
          <th>可退差价</th>
          <th style="width: 110px">申请日期</th>
          <th style="width: 110px">到期日期</th>
          <th style="width: 90px">状态</th>
          <th style="width: 150px">操作</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let record of records; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ record.orderId }}</td>
          <td>{{ record.productName }}</td>
          <td>¥{{ record.buyPrice }}</td>
          <td>¥{{ record.currentPrice }}</td>
          <td>
            <span class="diff-price">¥{{ record.diffPrice }}</span>
          </td>
          <td>{{ record.applyDate }}</td>
          <td>{{ record.expireDate }}</td>
          <td>
            <span class="tag" [ngClass]="statusClass[record.status]">{{
              statusLabels[record.status] ?? record.status
            }}</span>
          </td>
          <td>
            <ng-container *ngIf="record.status === 'pending'; else noAction">
              <button class="action-btn btn-success" (click)="handleApprove(record)">通过</button>
              <button class="action-btn btn-danger" style="margin-left: 6px" (click)="handleReject(record)">
                拒绝
              </button>
            </ng-container>
            <ng-template #noAction><span class="no-action">—</span></ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-price-protection-modal (orderAdded)="onOrderAdded()"></app-price-protection-modal>
